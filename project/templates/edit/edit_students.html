<!DOCTYPE html>
<html>

<head>
  <title>Edit Student</title>
  <link rel="stylesheet" href="bootstrap.min.css">
  <script src="jquery.min.js"></script>
  <script src="popper.min.js"></script>
  <script src="bootstrap.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.php">Students</a>
    </div>
  </nav>
  <div class="col-lg-6 m-auto">
    <form method="post" action="index.php?id_edit=DATA_ID">
      <br><br>
      <div class="card">
        <div class="card-header bg-warning">
          <h1 class="text-white text-center"> Update Student </h1>
        </div><br>

        <input type="hidden" name="id" value="DATA_ID" class="form-control"> <br>

        <label> NAME: </label>
        <input type="text" name="name" value="DATA_NAME" class="form-control"> <br>

        <label> NIM: </label>
        <input type="text" name="nim" value="DATA_NIM" class="form-control"> <br>
        <label> PHONE: </label>
        <input type="text" name="phone" value="DATA_PHONE" class="form-control"> <br>

        <label> JOIN DATE: </label>
        <input type="date" name="join_date" value="DATA_JOIN_DATE" class="form-control"> <br>
        <label> DEPARTEMENT: </label>
        <select class="form-select" name="departement" required>
          <option selected disabled value="">Pilih Departemen</option>
          OPTION_DEPARTMENTS
        </select> <br>
        <label> LECTURERS: </label>
        <select class="form-select" name="lecturers" required>
          <option selected disabled value="">Pilih Dosen</option>
          OPTION_LECTURERS
        </select> <br>

        <button class="btn btn-success" type="submit" name="submit"> Submit </button><br>
        <a class="btn btn-info" type="submit" name="cancel" href="index.php"> Cancel </a><br>
      </div>
    </form>
  </div>
